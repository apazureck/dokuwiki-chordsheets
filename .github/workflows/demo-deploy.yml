name: Deploy DokuWiki demo

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload and activate the verified ZIP release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chordsheets-demo-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned DokuWiki manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile ./deployment/demo-manifest.psd1
          "url=$($manifest.DokuWiki.Url)" >> $env:GITHUB_OUTPUT
          "sha256=$($manifest.DokuWiki.Sha256)" >> $env:GITHUB_OUTPUT
          "root=$($manifest.DokuWiki.RootName)" >> $env:GITHUB_OUTPUT

      - name: Download pinned DokuWiki release
        shell: bash
        env:
          DOKUWIKI_URL: ${{ steps.manifest.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/dokuwiki.tgz" \
            "$DOKUWIKI_URL"

      - name: Build verified demo ZIP
        shell: pwsh
        run: |
          ./deployment/build-demo-zip.ps1 `
            -DokuWikiArchive "$env:RUNNER_TEMP/dokuwiki.tgz" `
            -DokuWikiSha256 '${{ steps.manifest.outputs.sha256 }}' `
            -DokuWikiRootName '${{ steps.manifest.outputs.root }}' `
            -OutputArchive "$env:RUNNER_TEMP/dokuwiki-chordsheets-demo.zip"

      - name: Run deployment policy tests
        shell: pwsh
        run: |
          ./deployment/tests/artifact-build.test.ps1
          ./deployment/tests/zip-output.test.ps1
          ./deployment/tests/workflow-policy.test.ps1
          ./deployment/tests/php-web-deploy-policy.test.ps1
          ./deployment/tests/webgo-chroot-policy.test.ps1
          ./deployment/tests/webroot-discovery-policy.test.ps1

      - name: Test PHP web deployment and rollback
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/dokuwiki-chordsheets-demo.zip:/input/release.zip:ro" \
            -v "$GITHUB_WORKSPACE/deployment:/repo/deployment:ro" \
            composer:2@sha256:f0809732b2188154b3faa8e44ab900595acb0b09cd0aa6c34e798efe4ebc9021 \
            php /repo/deployment/tests/web-deploy.integration.php \
              /repo/deployment/web-deploy.php \
              /input/release.zip

      - name: Run local DokuWiki smoke test
        shell: pwsh
        run: |
          try {
            ./docker/smoke-test.ps1
          } finally {
            docker compose down --volumes
          }

      - name: Deploy one ZIP over explicit FTPS and activate over HTTPS
        if: ${{ inputs.deploy }}
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          set -euo pipefail
          umask 0077

          : "${FTP_PASSWORD:?FTP_PASSWORD is required}"
          : "${FTP_SERVER:?FTP_SERVER is required}"
          : "${FTP_USERNAME:?FTP_USERNAME is required}"
          : "${DEMO_URL:?DEMO_URL is required}"

          FTP_PORT=${FTP_PORT:-21}
          [[ "$FTP_PORT" == '21' ]]
          [[ "$FTP_SERVER" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$FTP_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEMO_URL" == 'https://chordsheets.pazureck.de' ]]

          release_archive="$RUNNER_TEMP/dokuwiki-chordsheets-demo.zip"
          runner_source="$GITHUB_WORKSPACE/deployment/web-deploy.php"
          archive_sha256=$(sha256sum "$release_archive" | awk '{print $1}')
          nonce=$(openssl rand -hex 16)
          deploy_secret=$(openssl rand -hex 32)
          expires_at=$(($(date +%s) + 900))
          runner_name="deploy-$nonce.php"
          archive_name=".release-$nonce.zip"
          token_name=".deploy-token-$nonce.php"
          runner_url="$DEMO_URL/$runner_name"
          ftp_base="ftp://$FTP_SERVER:$FTP_PORT"
          probe_name="deploy-probe-$nonce.txt"
          probe_file="$RUNNER_TEMP/$probe_name"
          probe_remote_path=''
          ftp_web_root=''
          web_root_found=0
          web_root_candidates=('' '/current' '/chordsheets-demo/current')
          token_file="$RUNNER_TEMP/$token_name"
          request_file="$RUNNER_TEMP/deployment-request.json"
          response_file="$RUNNER_TEMP/deployment-response.json"

          printf '%s' "$nonce" > "$probe_file"
          printf '%s\n' '<?php exit; __halt_compiler();' > "$token_file"
          jq -n \
            --arg nonce "$nonce" \
            --arg sha "$GITHUB_SHA" \
            --arg archive "$archive_name" \
            --arg archive_sha256 "$archive_sha256" \
            --arg secret "$deploy_secret" \
            --argjson expires_at "$expires_at" \
            '{
              version: 1,
              nonce: $nonce,
              sha: $sha,
              archive: $archive,
              archive_sha256: $archive_sha256,
              secret: $secret,
              expires_at: $expires_at,
              phase: "uploaded"
            }' >> "$token_file"

          ftp_options=(
            --fail
            --silent
            --show-error
            --ssl-reqd
            --tlsv1.2
            --user "$FTP_USERNAME:$FTP_PASSWORD"
          )

          ftp_upload() {
            local source_file=$1
            local target_path=$2
            curl "${ftp_options[@]}" \
              --upload-file "$source_file" \
              "$ftp_base$target_path"
          }

          ftp_delete() {
            local target_path=$1
            if ! curl "${ftp_options[@]}" \
              --quote "DELE $target_path" \
              --list-only \
              --output /dev/null \
              "$ftp_base/" >/dev/null 2>&1; then
              return 0
            fi
          }

          ftp_path() {
            local name=$1
            printf '%s/%s' "$ftp_web_root" "$name"
          }

          invoke_runner() {
            local action=$1
            local expected_state=$2
            local timestamp canonical signature
            timestamp=$(date +%s)
            jq -n \
              --arg action "$action" \
              --arg nonce "$nonce" \
              --arg sha "$GITHUB_SHA" \
              --argjson timestamp "$timestamp" \
              --arg archive_sha256 "$archive_sha256" \
              '{
                action: $action,
                nonce: $nonce,
                sha: $sha,
                timestamp: $timestamp,
                archive_sha256: $archive_sha256
              }' > "$request_file"
            printf -v canonical '%s\n%s\n%s\n%s\n%s' \
              "$action" "$nonce" "$GITHUB_SHA" "$timestamp" "$archive_sha256"
            signature=$(printf '%s' "$canonical" \
              | openssl dgst -sha256 -mac HMAC -macopt "hexkey:$deploy_secret" \
              | awk '{print $NF}')

            if ! curl --fail-with-body --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --header 'Content-Type: application/json' \
              --header "X-Deploy-Signature: $signature" \
              --data-binary "@$request_file" \
              --output "$response_file" \
              "$runner_url"; then
              if [[ -s "$response_file" ]]; then
                jq -r '.error // "Remote PHP deployment request failed."' \
                  "$response_file" 2>/dev/null
              fi
              return 1
            fi
            jq -e --arg expected "$expected_state" \
              '.ok == true and .state == $expected' \
              "$response_file" >/dev/null
          }

          deployment_may_be_active=0
          cleanup_deployment() {
            local status=$?
            trap - EXIT
            set +e
            if [[ "$deployment_may_be_active" -eq 1 ]]; then
              invoke_runner rollback rolled_back >/dev/null 2>&1
            fi
            if [[ -n "$probe_remote_path" ]]; then
              ftp_delete "$probe_remote_path"
            fi
            if [[ "$web_root_found" -eq 1 ]]; then
              ftp_delete "$(ftp_path "$runner_name")"
              ftp_delete "$(ftp_path "$archive_name")"
              ftp_delete "$(ftp_path "$token_name")"
            fi
            exit "$status"
          }
          trap cleanup_deployment EXIT

          for candidate in "${web_root_candidates[@]}"; do
            probe_remote_path="$candidate/$probe_name"
            if ! ftp_upload "$probe_file" "$candidate/$probe_name"; then
              ftp_delete "$candidate/$probe_name"
              probe_remote_path=''
              continue
            fi

            probe_response=''
            if probe_response=$(curl --fail --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --header 'Cache-Control: no-cache' \
              --max-time 15 \
              "$DEMO_URL/$probe_name"); then
              if [[ "$probe_response" == "$nonce" ]]; then
                ftp_web_root=$candidate
                web_root_found=1
                ftp_delete "$candidate/$probe_name"
                probe_remote_path=''
                break
              fi
            fi

            ftp_delete "$candidate/$probe_name"
            probe_remote_path=''
          done

          if [[ "$web_root_found" -ne 1 ]]; then
            echo 'Could not map the FTP account to the HTTPS document root.' >&2
            exit 1
          fi

          echo "Detected FTP web root: ${ftp_web_root:-/}"

          ftp_upload "$release_archive" "$(ftp_path "$archive_name")"
          ftp_upload "$runner_source" "$(ftp_path "$runner_name")"
          ftp_upload "$token_file" "$(ftp_path "$token_name")"

          deployment_may_be_active=1
          invoke_runner deploy active

          smoke_failed=0
          curl --fail --silent --show-error \
            "$DEMO_URL/doku.php?id=start" \
            | grep --fixed-strings 'DokuWiki Chordsheets Demo' \
            >/dev/null || smoke_failed=1
          curl --fail --silent --show-error \
            "$DEMO_URL/lib/plugins/chordsheets/script.js" \
            >/dev/null || smoke_failed=1

          protected_paths=(
            '/install.php'
            '/conf/'
            '/conf/local.php'
            '/conf/users.auth.php'
            '/conf/acl.auth.php'
            '/data/'
            '/data/pages/start.txt'
          )
          for protected_path in "${protected_paths[@]}"; do
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "$DEMO_URL$protected_path") || status=000
            [[ "$status" == '403' || "$status" == '404' ]] || smoke_failed=1
          done

          redirect_result=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            'http://chordsheets.pazureck.de/') || redirect_result='000'
          [[ "$redirect_result" =~ ^30[1278]\ https://chordsheets\.pazureck\.de/ ]] \
            || smoke_failed=1

          if [[ "$smoke_failed" -ne 0 ]]; then
            invoke_runner rollback rolled_back
            deployment_may_be_active=0
            echo 'Remote smoke test failed; rollback completed.' >&2
            exit 1
          fi

          invoke_runner commit committed
          deployment_may_be_active=0
          echo "Demo ZIP deployment succeeded for $GITHUB_SHA."
